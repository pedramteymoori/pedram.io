<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Pedram Teymoori's personal website.">
    <title>Pedram Teymoori</title>
    <style>
        :root {
            --bg: #0a0a0b;
            --fg: #f5f5f7;
            --muted: #8b8b93;
            --border: rgba(255, 255, 255, 0.1);
            --glow: rgba(99, 102, 241, 0.35);
            --glow-2: rgba(236, 72, 153, 0.22);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #fafafa;
                --fg: #111113;
                --muted: #6b6b73;
                --border: rgba(0, 0, 0, 0.1);
                --glow: rgba(99, 102, 241, 0.25);
                --glow-2: rgba(236, 72, 153, 0.15);
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
        }
        body::before, body::after {
            content: "";
            position: absolute;
            width: 55vmax;
            height: 55vmax;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            background: var(--glow);
            top: -25vmax;
            left: -15vmax;
            animation: drift 18s ease-in-out infinite alternate;
        }
        body::after {
            background: var(--glow-2);
            bottom: -30vmax;
            right: -15vmax;
            animation: drift 22s ease-in-out infinite alternate-reverse;
        }
        @keyframes drift {
            to { transform: translate(6vmax, 4vmax) scale(1.1); }
        }
        main {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
        }
        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.05;
            background: linear-gradient(180deg, var(--fg) 40%, var(--muted));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        nav {
            margin-top: 2.5rem;
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }
        nav a {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border);
            color: var(--muted);
            background: rgba(127, 127, 127, 0.06);
            backdrop-filter: blur(8px);
            transition: color 0.2s, border-color 0.2s, transform 0.2s;
        }
        nav a:hover, nav a:focus-visible {
            color: var(--fg);
            border-color: var(--muted);
            transform: translateY(-3px);
            outline: none;
        }
        nav svg { width: 20px; height: 20px; fill: currentColor; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
