<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Pedram Teymoori's personal website.">
    <title>Pedram Teymoori</title>
    <style>
        :root {
            --bg: #0a0a0b;
            --fg: #f5f5f7;
            --muted: #8b8b93;
            --border: rgba(255, 255, 255, 0.1);
            --glow: rgba(99, 102, 241, 0.35);
            --glow-2: rgba(236, 72, 153, 0.22);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #fafafa;
                --fg: #111113;
                --muted: #6b6b73;
                --border: rgba(0, 0, 0, 0.1);
                --glow: rgba(99, 102, 241, 0.25);
                --glow-2: rgba(236, 72, 153, 0.15);
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
        }
        body::before, body::after {
            content: "";
            position: absolute;
            width: 55vmax;
            height: 55vmax;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            background: var(--glow);
            top: -25vmax;
            left: -15vmax;
            animation: drift 18s ease-in-out infinite alternate;
        }
        body::after {
            background: var(--glow-2);
            bottom: -30vmax;
            right: -15vmax;
            animation: drift 22s ease-in-out infinite alternate-reverse;
        }
        @keyframes drift {
            to { transform: translate(6vmax, 4vmax) scale(1.1); }
        }
        .grid {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
        }
        #net {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        main {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
        }
        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.05;
            background: linear-gradient(180deg, var(--fg) 40%, var(--muted));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .mono {
            font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        }
        .prompt {
            margin: 1.25rem 0 0;
            font-size: clamp(0.9rem, 2.2vw, 1.05rem);
            color: var(--muted);
            min-height: 3em;
            max-width: 32ch;
            margin-left: auto;
            margin-right: auto;
        }
        .prompt .sigil { color: #818cf8; }
        .cursor {
            display: inline-block;
            width: 0.55em;
            height: 1.1em;
            margin-left: 2px;
            vertical-align: text-bottom;
            background: currentColor;
            animation: blink 1.1s steps(1) infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        footer {
            position: absolute;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            z-index: 1;
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
            opacity: 0.6;
        }
        nav {
            margin-top: 2.5rem;
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }
        nav a {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border);
            color: var(--muted);
            background: rgba(127, 127, 127, 0.06);
            backdrop-filter: blur(8px);
            transition: color 0.2s, border-color 0.2s, transform 0.2s;
        }
        nav a:hover, nav a:focus-visible {
            color: var(--fg);
            border-color: var(--muted);
            transform: translateY(-3px);
            outline: none;
        }
        nav svg { width: 20px; height: 20px; fill: currentColor; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<canvas id="net" aria-hidden="true"></canvas>
<main>
    <h1>Pedram<br>Teymoori</h1>
    <p class="prompt mono"><span class="sigil">&gt;</span> <span id="typed"></span><span class="cursor" aria-hidden="true"></span></p>
    <nav aria-label="Social links">
        <a href="https://github.com/pedramteymoori" target="_blank" rel="noopener" aria-label="GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
        </a>
        <a href="https://x.com/pedramteymoori" target="_blank" rel="noopener" aria-label="X">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.21-6.82-5.97 6.82H1.67l7.73-8.84L1.25 2.25h6.83l4.71 6.23 5.45-6.23zm-1.16 17.52h1.83L7.08 4.13H5.12l11.96 15.64z"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/pedram-teymoori-35ba36103/" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
        </a>
    </nav>
</main>
<footer class="mono" aria-hidden="true">~/pedram.io $ exit 0</footer>
<script>
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Terminal-style typing line
    const phrases = [
        "What else are you looking for?",
        "Are you looking for an easter egg?",
        "That's it dear, I don't know more frontend than this!",
        "You might be interested in clicking one of the links below.",
    ];
    const typed = document.getElementById("typed");
    if (reduceMotion) {
        typed.textContent = phrases[0];
    } else {
        let p = 0, i = 0, deleting = false;
        (function tick() {
            const word = phrases[p];
            i += deleting ? -1 : 1;
            typed.textContent = word.slice(0, i);
            let delay = deleting ? 25 : 60;
            if (!deleting && i === word.length) { deleting = true; delay = 1800; }
            else if (deleting && i === 0) { deleting = false; p = (p + 1) % phrases.length; delay = 400; }
            setTimeout(tick, delay);
        })();
    }

    // Faint neural-network constellation
    const canvas = document.getElementById("net");
    const ctx = canvas.getContext("2d");
    const mouse = { x: -1e4, y: -1e4 };
    let nodes = [], w, h;

    function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.round(Math.min(70, (w * h) / 18000));
        nodes = Array.from({ length: count }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.25,
            vy: (Math.random() - 0.5) * 0.25,
        }));
    }

    function draw() {
        const light = matchMedia("(prefers-color-scheme: light)").matches;
        const rgb = light ? "79, 70, 229" : "165, 180, 252";
        const maxDist = 140;
        ctx.clearRect(0, 0, w, h);
        for (const n of nodes) {
            if (!reduceMotion) {
                n.x += n.vx; n.y += n.vy;
                if (n.x < 0 || n.x > w) n.vx *= -1;
                if (n.y < 0 || n.y > h) n.vy *= -1;
            }
        }
        for (let a = 0; a < nodes.length; a++) {
            const n = nodes[a];
            for (let b = a + 1; b < nodes.length; b++) {
                const m = nodes[b];
                const d = Math.hypot(n.x - m.x, n.y - m.y);
                if (d < maxDist) {
                    ctx.strokeStyle = `rgba(${rgb}, ${0.12 * (1 - d / maxDist)})`;
                    ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(m.x, m.y); ctx.stroke();
                }
            }
            const dm = Math.hypot(n.x - mouse.x, n.y - mouse.y);
            if (dm < maxDist * 1.4) {
                ctx.strokeStyle = `rgba(${rgb}, ${0.3 * (1 - dm / (maxDist * 1.4))})`;
                ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
            }
            ctx.fillStyle = `rgba(${rgb}, 0.35)`;
            ctx.beginPath(); ctx.arc(n.x, n.y, 1.4, 0, Math.PI * 2); ctx.fill();
        }
        if (!reduceMotion) requestAnimationFrame(draw);
    }

    addEventListener("resize", () => { resize(); if (reduceMotion) draw(); });
    addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    addEventListener("pointerleave", () => { mouse.x = mouse.y = -1e4; });
    resize();
    draw();
</script>
</body>
</html>
